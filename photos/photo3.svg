<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg3)" rx="24"/>

  <!-- Stars in background -->
  <g fill="#ffffff">
    <circle cx="100" cy="120" r="2.5" opacity="0.8"/>
    <circle cx="220" cy="90" r="3" opacity="0.9"/>
    <circle cx="340" cy="140" r="2" opacity="0.7"/>
    <circle cx="480" cy="110" r="3.5" opacity="0.85"/>
    <circle cx="140" cy="240" r="2" opacity="0.6"/>
    <circle cx="510" cy="260" r="3" opacity="0.8"/>
    <circle cx="90" cy="400" r="2.5" opacity="0.7"/>
    <circle cx="520" cy="420" r="2" opacity="0.9"/>
  </g>

  <!-- Big Sparkling Stars -->
  <g fill="#fde047" filter="url(#glow3)">
    <polygon points="170,180 173,190 183,193 173,196 170,206 167,196 157,193 167,190"/>
    <polygon points="430,220 433,230 443,233 433,236 430,246 427,236 417,233 427,230"/>
    <polygon points="260,340 263,350 273,353 263,356 260,366 257,356 247,353 257,350"/>
  </g>

  <!-- Shooting Star with Trail -->
  <g>
    <path d="M 120,80 L 280,180" stroke="url(#moonGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 80,60 L 260,175" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="10,15" opacity="0.6"/>
    <polygon points="280,180 286,170 300,175 290,186 295,200 280,192 268,202 272,188 260,178 274,175" fill="#fde047" filter="url(#glow3)"/>
  </g>

  <!-- Cute Golden Crescent Moon with sleepy smiling face -->
  <g transform="translate(300, 270)">
    <path d="M -20,-110 C 60,-110 120,-50 120,40 C 120,130 50,180 -30,170 C 50,150 80,70 70,0 C 60,-60 10,-100 -20,-110 Z" fill="url(#moonGrad)" filter="url(#glow3)"/>
    <!-- Sleeping Face on Moon -->
    <path d="M 40,-5 Q 46,5 54,-2" stroke="#854d0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 32,25 Q 44,38 52,28" stroke="#854d0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Moon Blush -->
    <ellipse cx="38" cy="15" rx="10" ry="6" fill="#f43f5e" opacity="0.4"/>
    <!-- Little Sleeping Cap -->
    <path d="M -15,-105 Q 10,-140 40,-130 Q 30,-100 -5,-95 Z" fill="#ec4899"/>
    <circle cx="40" cy="-130" r="8" fill="#ffffff"/>
  </g>

  <!-- Fluffy Pastel Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 100,520 C 100,470 160,450 190,470 C 220,440 290,440 320,470 C 350,450 410,460 420,500 C 460,500 480,540 460,570 C 430,590 120,590 100,520 Z" />
    <path d="M 240,490 C 260,450 330,440 360,470 C 390,450 450,460 470,500 C 510,510 520,550 490,570 C 450,590 260,580 240,490 Z" fill="#fbcfe8" opacity="0.7"/>
  </g>

  <!-- Text Badge -->
  <rect x="140" y="580" width="320" height="60" rx="30" fill="#ffffff" filter="url(#glow3)"/>
  <text x="300" y="618" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#4338ca" text-anchor="middle">
    Make a Wish, Nandhini 📍✨
  </text>
</svg>
