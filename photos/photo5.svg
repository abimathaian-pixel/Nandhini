<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="shadow5">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg5)" rx="24"/>

  <!-- Background study notes / chaotic doodles -->
  <g stroke="#059669" stroke-width="2" fill="none" opacity="0.25">
    <!-- DNA Double Helix -->
    <path d="M 90,120 Q 120,160 90,200 Q 60,240 90,280" />
    <path d="M 110,120 Q 80,160 110,200 Q 140,240 110,280" />
    <line x1="85" y1="140" x2="115" y2="140"/>
    <line x1="100" y1="180" x2="100" y2="180"/>
    <line x1="85" y1="220" x2="115" y2="220"/>
    <line x1="75" y1="260" x2="125" y2="260"/>

    <!-- Biology cell & atom -->
    <circle cx="500" cy="160" r="35"/>
    <ellipse cx="500" cy="160" rx="45" ry="15" transform="rotate(30 500 160)"/>
    <ellipse cx="500" cy="160" rx="45" ry="15" transform="rotate(-30 500 160)"/>
  </g>

  <!-- Chaos lines & question marks -->
  <text x="140" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#059669" opacity="0.4">???</text>
  <text x="460" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#059669" opacity="0.4">NEET 🧬</text>

  <!-- Chibi "Medusa" Character -->
  <g transform="translate(300, 310)" filter="url(#shadow5)">
    <!-- Massive Curly Hair Cloud -->
    <g fill="#451a03">
      <!-- Hair curls -->
      <circle cx="0" cy="-30" r="95"/>
      <circle cx="-75" cy="-20" r="60"/>
      <circle cx="75" cy="-20" r="60"/>
      <circle cx="-90" cy="40" r="55"/>
      <circle cx="90" cy="40" r="55"/>
      <circle cx="-60" cy="90" r="50"/>
      <circle cx="60" cy="90" r="50"/>
      <circle cx="0" cy="80" r="55"/>
    </g>

    <!-- Playful Cute Snake Curls peeking out! -->
    <!-- Left Snake 1 -->
    <g transform="translate(-105, -50)">
      <path d="M 40,25 Q -10,-10 -30,-40" stroke="#10b981" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="-32" cy="-42" r="10" fill="#10b981"/>
      <circle cx="-35" cy="-44" r="3" fill="#ffffff"/>
      <circle cx="-30" cy="-44" r="3" fill="#ffffff"/>
      <circle cx="-35" cy="-44" r="1.5" fill="#064e3b"/>
      <circle cx="-30" cy="-44" r="1.5" fill="#064e3b"/>
      <!-- Tiny forked tongue -->
      <path d="M -42,-44 L -50,-46 M -42,-44 L -50,-42" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Right Snake 2 -->
    <g transform="translate(105, -50)">
      <path d="M -40,25 Q 10,-10 30,-40" stroke="#34d399" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="-42" r="10" fill="#34d399"/>
      <circle cx="29" cy="-44" r="3" fill="#ffffff"/>
      <circle cx="35" cy="-44" r="3" fill="#ffffff"/>
      <circle cx="29" cy="-44" r="1.5" fill="#064e3b"/>
      <circle cx="35" cy="-44" r="1.5" fill="#064e3b"/>
      <!-- Tiny party hat on this snake! -->
      <polygon points="32,-52 26,-68 38,-68" fill="#f43f5e" />
    </g>

    <!-- Top Snake 3 -->
    <g transform="translate(0, -110)">
      <path d="M 0,35 Q 20,0 10,-25" stroke="#10b981" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="10" cy="-28" r="10" fill="#10b981"/>
      <circle cx="7" cy="-30" r="3" fill="#ffffff"/>
      <circle cx="13" cy="-30" r="3" fill="#ffffff"/>
      <circle cx="7" cy="-30" r="1.5" fill="#064e3b"/>
      <circle cx="13" cy="-30" r="1.5" fill="#064e3b"/>
      <path d="M 10,-38 L 10,-46" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Chibi Face -->
    <ellipse cx="0" cy="15" rx="65" ry="60" fill="#fde2d2"/>

    <!-- Curly Bangs -->
    <path d="M -50,-15 Q -20,10 0,-15 Q 20,10 50,-15 Q 0,-35 -50,-15 Z" fill="#451a03"/>
    <circle cx="-35" cy="-8" r="15" fill="#451a03"/>
    <circle cx="35" cy="-8" r="15" fill="#451a03"/>

    <!-- Laughing / Happy Eyes (XD expression or closed arcs) -->
    <path d="M -35,12 L -15,22 L -35,32" stroke="#451a03" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 35,12 L 15,22 L 35,32" stroke="#451a03" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Laughing open mouth -->
    <path d="M -16,36 Q 0,55 16,36 Z" fill="#e11d48"/>
    <path d="M -10,38 Q 0,46 10,38 Z" fill="#fda4af"/>

    <!-- Rosy blushing cheeks -->
    <ellipse cx="-40" cy="30" rx="14" ry="8" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="40" cy="30" rx="14" ry="8" fill="#fb7185" opacity="0.6"/>

    <!-- Cute Body holding NEET Book -->
    <!-- Yellow hoodie -->
    <path d="M -40,75 L 40,75 L 50,160 L -50,160 Z" fill="#fbbf24" rx="10"/>

    <!-- Big Thick Book (NEET Coaching Book) -->
    <g transform="translate(0, 120)">
      <rect x="-65" y="-15" width="130" height="55" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
      <rect x="-60" y="-10" width="120" height="45" rx="4" fill="#ffffff"/>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">
        NEET BIOLOGY 📖
      </text>
      <!-- Chibi hands holding book -->
      <circle cx="-50" cy="10" r="12" fill="#fde2d2"/>
      <circle cx="50" cy="10" r="12" fill="#fde2d2"/>
    </g>
  </g>

  <!-- Bottom Badge -->
  <rect x="120" y="570" width="360" height="60" rx="30" fill="#ffffff" filter="url(#shadow5)"/>
  <text x="300" y="608" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">
    Medusa Days 😂🐍 (NEET Chaos)
  </text>
</svg>
